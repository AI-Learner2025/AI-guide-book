<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Codex multi-session app development workflow</title>
  <desc id="desc">A diagram showing one main Codex session coordinating multiple worktree sessions as agents for frontend, backend, QA, docs, and review work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#102332"/>
      <stop offset="100%" stop-color="#21162f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#67e8f9"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="54" y="46" width="1172" height="628" rx="30" fill="#0f172a" opacity="0.86" stroke="#334860" stroke-width="2"/>
  <text x="96" y="110" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">Codex 多 Session 开发 App</text>
  <text x="96" y="150" fill="#a8b6ca" font-family="Inter, Arial, sans-serif" font-size="21">一个主控 session 做架构和合并，多个 worktree session 分别像 agent 一样执行子任务。</text>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="470" y="188" width="340" height="126" rx="24" fill="#162238" stroke="#60a5fa"/>
    <text x="522" y="238" fill="#f8fafc" font-size="28" font-weight="800">主控 Session</text>
    <text x="522" y="274" fill="#bfd3ee" font-size="18">产品目标 · 架构决策 · 任务拆分 · 合并验收</text>

    <rect x="94" y="424" width="190" height="130" rx="20" fill="#18291f" stroke="#4ade80"/>
    <text x="126" y="472" fill="#f8fafc" font-size="24" font-weight="800">前端 Agent</text>
    <text x="126" y="508" fill="#c2e8cc" font-size="17">页面 / 组件</text>
    <text x="126" y="532" fill="#c2e8cc" font-size="17">浏览器验证</text>

    <rect x="318" y="424" width="190" height="130" rx="20" fill="#2a2037" stroke="#a78bfa"/>
    <text x="350" y="472" fill="#f8fafc" font-size="24" font-weight="800">后端 Agent</text>
    <text x="350" y="508" fill="#ddcff5" font-size="17">API / 数据库</text>
    <text x="350" y="532" fill="#ddcff5" font-size="17">测试 / schema</text>

    <rect x="542" y="424" width="190" height="130" rx="20" fill="#372516" stroke="#f59e0b"/>
    <text x="574" y="472" fill="#f8fafc" font-size="24" font-weight="800">QA Agent</text>
    <text x="574" y="508" fill="#ead2ae" font-size="17">测试 / 回归</text>
    <text x="574" y="532" fill="#ead2ae" font-size="17">缺陷清单</text>

    <rect x="766" y="424" width="190" height="130" rx="20" fill="#172a2d" stroke="#22d3ee"/>
    <text x="798" y="472" fill="#f8fafc" font-size="24" font-weight="800">Docs Agent</text>
    <text x="798" y="508" fill="#b9edf3" font-size="17">README / 教程</text>
    <text x="798" y="532" fill="#b9edf3" font-size="17">变更说明</text>

    <rect x="990" y="424" width="190" height="130" rx="20" fill="#311f2c" stroke="#fb7185"/>
    <text x="1022" y="472" fill="#f8fafc" font-size="24" font-weight="800">Review Agent</text>
    <text x="1022" y="508" fill="#efc5d1" font-size="17">安全 / 性能</text>
    <text x="1022" y="532" fill="#efc5d1" font-size="17">合并建议</text>
  </g>

  <line x1="570" y1="322" x2="210" y2="414" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="610" y1="322" x2="430" y2="414" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="640" y1="322" x2="640" y2="414" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="670" y1="322" x2="850" y2="414" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="710" y1="322" x2="1060" y2="414" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="96" y="606" width="1088" height="42" rx="13" fill="#111827" stroke="#334860"/>
  <text x="126" y="633" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="18">控制原则：一个 session 一个职责，一个 worktree 一个改动边界，最后由主控 session 合并和验收。</text>
</svg>
