<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Grok Build workflow and comparison</title>
  <desc id="desc">A diagram explaining Grok Build installation, usage flow, and comparison with Codex and Claude Code.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="52%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f7f2ff"/>
    </linearGradient>
    <linearGradient id="grok" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="codex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="claude" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="780" fill="url(#bg)"/>
  <circle cx="1055" cy="100" r="135" fill="#dbeafe" opacity="0.45"/>
  <circle cx="120" cy="705" r="150" fill="#ede9fe" opacity="0.5"/>

  <text x="72" y="82" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">Grok Build 从安装到使用</text>
  <text x="72" y="124" font-family="Inter, Arial, sans-serif" font-size="21" fill="#475569">终端编程 Agent：安装、登录、规划、执行、验证，再和 Codex / Claude Code 对比。</text>

  <g filter="url(#shadow)">
    <rect x="72" y="168" width="250" height="160" rx="22" fill="#ffffff"/>
    <rect x="72" y="168" width="250" height="12" rx="6" fill="url(#grok)"/>
    <text x="102" y="220" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800" fill="#0f172a">1. 安装</text>
    <text x="102" y="260" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">macOS / Linux / WSL</text>
    <text x="102" y="292" font-family="SFMono-Regular, Menlo, monospace" font-size="16" fill="#2563eb">curl ... | bash</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="360" y="168" width="250" height="160" rx="22" fill="#ffffff"/>
    <rect x="360" y="168" width="250" height="12" rx="6" fill="url(#grok)"/>
    <text x="390" y="220" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800" fill="#0f172a">2. 登录</text>
    <text x="390" y="260" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">浏览器授权</text>
    <text x="390" y="292" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">或 XAI_API_KEY</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="648" y="168" width="250" height="160" rx="22" fill="#ffffff"/>
    <rect x="648" y="168" width="250" height="12" rx="6" fill="url(#grok)"/>
    <text x="678" y="220" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800" fill="#0f172a">3. 规划</text>
    <text x="678" y="260" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">先用 /plan</text>
    <text x="678" y="292" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">审批后再改代码</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="936" y="168" width="190" height="160" rx="22" fill="#ffffff"/>
    <rect x="936" y="168" width="190" height="12" rx="6" fill="url(#grok)"/>
    <text x="966" y="220" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800" fill="#0f172a">4. 交付</text>
    <text x="966" y="260" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">测试 / diff</text>
    <text x="966" y="292" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">提交 / 推送</text>
  </g>

  <path d="M322 248 C342 248 342 248 360 248" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M610 248 C630 248 630 248 648 248" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M898 248 C918 248 918 248 936 248" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="72" y="388" width="326" height="235" rx="22" fill="#ffffff"/>
    <rect x="72" y="388" width="326" height="12" rx="6" fill="url(#grok)"/>
    <text x="102" y="445" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#111827">Grok Build</text>
    <text x="102" y="488" font-family="Inter, Arial, sans-serif" font-size="19" fill="#334155">强项：终端 TUI、Grok 4.5、</text>
    <text x="102" y="520" font-family="Inter, Arial, sans-serif" font-size="19" fill="#334155">Plan、Subagents、Skills、</text>
    <text x="102" y="552" font-family="Inter, Arial, sans-serif" font-size="19" fill="#334155">MCP、Imagine 命令。</text>
    <text x="102" y="594" font-family="Inter, Arial, sans-serif" font-size="17" fill="#64748b">适合：想体验 xAI 编程工作流的人。</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="437" y="388" width="326" height="235" rx="22" fill="#ffffff"/>
    <rect x="437" y="388" width="326" height="12" rx="6" fill="url(#codex)"/>
    <text x="467" y="445" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#111827">Codex</text>
    <text x="467" y="488" font-family="Inter, Arial, sans-serif" font-size="19" fill="#334155">强项：CLI + App、Goal、</text>
    <text x="467" y="520" font-family="Inter, Arial, sans-serif" font-size="19" fill="#334155">Resume、Fork、Skills、</text>
    <text x="467" y="552" font-family="Inter, Arial, sans-serif" font-size="19" fill="#334155">插件、浏览器和 GitHub 流程。</text>
    <text x="467" y="594" font-family="Inter, Arial, sans-serif" font-size="17" fill="#64748b">适合：长期项目、文档、代码和多工具协作。</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="802" y="388" width="326" height="235" rx="22" fill="#ffffff"/>
    <rect x="802" y="388" width="326" height="12" rx="6" fill="url(#claude)"/>
    <text x="832" y="445" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#111827">Claude Code</text>
    <text x="832" y="488" font-family="Inter, Arial, sans-serif" font-size="19" fill="#334155">强项：终端 Agent、CLAUDE.md、</text>
    <text x="832" y="520" font-family="Inter, Arial, sans-serif" font-size="19" fill="#334155">MCP、代码理解、重构、</text>
    <text x="832" y="552" font-family="Inter, Arial, sans-serif" font-size="19" fill="#334155">测试和权限确认。</text>
    <text x="832" y="594" font-family="Inter, Arial, sans-serif" font-size="17" fill="#64748b">适合：Claude 生态和代码审查/重构场景。</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="140" y="668" width="920" height="54" rx="16" fill="#ffffff"/>
    <text x="172" y="703" font-family="Inter, Arial, sans-serif" font-size="20" fill="#334155">选择建议：Grok Build 看 xAI 新能力，Codex 做长期可控工作流，Claude Code 做 Claude 生态里的深度代码协作。</text>
  </g>
</svg>
