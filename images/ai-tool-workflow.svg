<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI tool workflow</title>
  <desc id="desc">A workflow diagram showing how to use AI tools from goal definition to preparation, execution, verification, publishing, and reuse.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d1321"/>
      <stop offset="55%" stop-color="#102332"/>
      <stop offset="100%" stop-color="#22182e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#67e8f9"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="54" y="46" width="1172" height="628" rx="30" fill="#111827" opacity="0.82" stroke="#31445e" stroke-width="2"/>
  <text x="94" y="112" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">AI 工具工作流</text>
  <text x="94" y="152" fill="#a8b6ca" font-family="Inter, Arial, sans-serif" font-size="21">把一次性提问变成可复用、可验证、可交付的生产流程。</text>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="98" y="230" width="152" height="132" rx="20" fill="#172033" stroke="#3b82f6"/>
    <text x="126" y="278" fill="#f8fafc" font-size="23" font-weight="800">1. 目标</text>
    <text x="126" y="316" fill="#aebbd0" font-size="17">产物</text>
    <text x="126" y="342" fill="#aebbd0" font-size="17">受众</text>

    <rect x="304" y="230" width="152" height="132" rx="20" fill="#18271f" stroke="#22c55e"/>
    <text x="332" y="278" fill="#f8fafc" font-size="23" font-weight="800">2. 准备</text>
    <text x="332" y="316" fill="#b9d6c5" font-size="17">账号</text>
    <text x="332" y="342" fill="#b9d6c5" font-size="17">模型</text>

    <rect x="510" y="230" width="152" height="132" rx="20" fill="#2a2036" stroke="#a78bfa"/>
    <text x="538" y="278" fill="#f8fafc" font-size="23" font-weight="800">3. 工具</text>
    <text x="538" y="316" fill="#d1c4ef" font-size="17">Codex</text>
    <text x="538" y="342" fill="#d1c4ef" font-size="17">Skills</text>

    <rect x="716" y="230" width="152" height="132" rx="20" fill="#342515" stroke="#f59e0b"/>
    <text x="744" y="278" fill="#f8fafc" font-size="23" font-weight="800">4. 执行</text>
    <text x="744" y="316" fill="#e8cfaa" font-size="17">代码</text>
    <text x="744" y="342" fill="#e8cfaa" font-size="17">文档</text>

    <rect x="922" y="230" width="152" height="132" rx="20" fill="#172a2d" stroke="#22d3ee"/>
    <text x="950" y="278" fill="#f8fafc" font-size="23" font-weight="800">5. 验证</text>
    <text x="950" y="316" fill="#b7e6ef" font-size="17">测试</text>
    <text x="950" y="342" fill="#b7e6ef" font-size="17">预览</text>

    <rect x="510" y="470" width="152" height="132" rx="20" fill="#311d28" stroke="#fb7185"/>
    <text x="538" y="518" fill="#f8fafc" font-size="23" font-weight="800">6. 沉淀</text>
    <text x="538" y="556" fill="#efc0cb" font-size="17">模板</text>
    <text x="538" y="582" fill="#efc0cb" font-size="17">Skill</text>

    <rect x="716" y="470" width="152" height="132" rx="20" fill="#202638" stroke="#60a5fa"/>
    <text x="744" y="518" fill="#f8fafc" font-size="23" font-weight="800">7. 发布</text>
    <text x="744" y="556" fill="#c1d7f7" font-size="17">GitHub</text>
    <text x="744" y="582" fill="#c1d7f7" font-size="17">视频</text>
  </g>

  <line x1="260" y1="296" x2="294" y2="296" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="466" y1="296" x2="500" y2="296" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="672" y1="296" x2="706" y2="296" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="878" y1="296" x2="912" y2="296" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M998 376 C998 432 920 536 882 536" fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="706" y1="536" x2="672" y2="536" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M586 456 C586 418 586 394 586 374" fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="94" y="638" width="1092" height="1" fill="#31445e"/>
  <text x="94" y="626" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="18">关键点：每轮都要留下可复用资产，例如提示词、模板、脚本、Skill、截图和发布记录。</text>
</svg>
