<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Claude and Premiere Pro editing workflow</title>
  <desc id="desc">A workflow diagram showing how Claude can integrate with Adobe Premiere Pro through scripts, MCP, transcript analysis, edit decision lists, and human review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#10131f"/>
      <stop offset="54%" stop-color="#1a1831"/>
      <stop offset="100%" stop-color="#251625"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#c4b5fd"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="54" y="46" width="1172" height="628" rx="30" fill="#0f172a" opacity="0.86" stroke="#394563" stroke-width="2"/>
  <text x="96" y="110" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">Claude + Premiere Pro</text>
  <text x="96" y="150" fill="#aeb8cd" font-family="Inter, Arial, sans-serif" font-size="21">让 Claude 负责理解、计划和生成脚本，让 Premiere 保留专业剪辑时间线。</text>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="96" y="220" width="184" height="142" rx="20" fill="#182033" stroke="#60a5fa"/>
    <text x="126" y="270" fill="#f8fafc" font-size="25" font-weight="800">素材输入</text>
    <text x="126" y="310" fill="#c5d4ea" font-size="17">视频 / 音频</text>
    <text x="126" y="336" fill="#c5d4ea" font-size="17">字幕 / 文稿</text>

    <rect x="340" y="220" width="184" height="142" rx="20" fill="#251d34" stroke="#a78bfa"/>
    <text x="370" y="270" fill="#f8fafc" font-size="25" font-weight="800">Claude</text>
    <text x="370" y="310" fill="#dacdf7" font-size="17">理解内容</text>
    <text x="370" y="336" fill="#dacdf7" font-size="17">生成剪辑计划</text>

    <rect x="584" y="220" width="184" height="142" rx="20" fill="#172a2e" stroke="#22d3ee"/>
    <text x="614" y="270" fill="#f8fafc" font-size="25" font-weight="800">桥接层</text>
    <text x="614" y="310" fill="#b9edf3" font-size="17">MCP / 脚本</text>
    <text x="614" y="336" fill="#b9edf3" font-size="17">EDL / JSON</text>

    <rect x="828" y="220" width="184" height="142" rx="20" fill="#311f2c" stroke="#fb7185"/>
    <text x="858" y="270" fill="#f8fafc" font-size="25" font-weight="800">Premiere</text>
    <text x="858" y="310" fill="#efc5d1" font-size="17">时间线</text>
    <text x="858" y="336" fill="#efc5d1" font-size="17">剪切 / 字幕</text>

    <rect x="584" y="470" width="428" height="110" rx="20" fill="#171f2b" stroke="#4b5e7d"/>
    <text x="620" y="512" fill="#f8fafc" font-size="24" font-weight="800">人工审核 + 导出</text>
    <text x="620" y="548" fill="#b6c3d8" font-size="18">检查节奏、版权、字幕、音量、画面安全区，然后导出成片。</text>
  </g>

  <line x1="290" y1="291" x2="330" y2="291" stroke="#c4b5fd" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="534" y1="291" x2="574" y2="291" stroke="#c4b5fd" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="778" y1="291" x2="818" y2="291" stroke="#c4b5fd" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M920 376 C920 424 892 454 854 464" fill="none" stroke="#c4b5fd" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M644 464 C556 430 476 394 430 374" fill="none" stroke="#c4b5fd" stroke-width="4" marker-end="url(#arrow)"/>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="96" y="486" width="374" height="84" rx="18" fill="#111827" stroke="#344760"/>
    <text x="126" y="522" fill="#f8fafc" font-size="22" font-weight="800">可自动化</text>
    <text x="126" y="552" fill="#aeb8cd" font-size="17">粗剪、字幕、章节、素材整理、标记点、导出预设。</text>
  </g>

  <text x="96" y="638" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="18">原则：Claude 可以提高剪辑效率，但最终节奏、版权、人物形象和发布风险仍应由人审核。</text>
</svg>
