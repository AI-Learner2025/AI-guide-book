<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Codex and Remotion video effect preview</title>
  <desc id="desc">A stylized video frame showing what Codex and Remotion can create: a React-based product update video with animated panels, charts, captions, and a timeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="58%" stop-color="#121a2f"/>
      <stop offset="100%" stop-color="#1a1030"/>
    </linearGradient>
    <radialGradient id="glowA" cx="22%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.38"/>
      <stop offset="65%" stop-color="#4ade80" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="26%" r="52%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.42"/>
      <stop offset="68%" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.36"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glowA)"/>
  <rect width="1280" height="720" fill="url(#glowB)"/>

  <rect x="54" y="48" width="1172" height="624" rx="30" fill="#0f172a" opacity="0.86" stroke="#30425f" stroke-width="2"/>
  <text x="94" y="112" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800">Codex + Remotion</text>
  <text x="94" y="150" fill="#a7b6cf" font-family="Inter, Arial, sans-serif" font-size="20">React components become reusable, data-driven video templates.</text>

  <g filter="url(#shadow)">
    <rect x="94" y="202" width="598" height="314" rx="22" fill="#111827" stroke="#405273"/>
    <rect x="116" y="224" width="554" height="270" rx="16" fill="#0b1220"/>
    <rect x="140" y="250" width="250" height="36" rx="8" fill="#22c55e" opacity="0.92"/>
    <text x="156" y="275" fill="#052e16" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Product Update Video</text>
    <text x="140" y="332" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="900">Ship notes</text>
    <text x="140" y="382" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="900">as motion.</text>
    <text x="142" y="430" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="22">Generated from props, changelog data, and React components.</text>
    <rect x="498" y="252" width="132" height="176" rx="18" fill="#1f2937" stroke="#475569"/>
    <rect x="520" y="338" width="20" height="60" rx="10" fill="#22c55e"/>
    <rect x="552" y="302" width="20" height="96" rx="10" fill="#38bdf8"/>
    <rect x="584" y="276" width="20" height="122" rx="10" fill="#a78bfa"/>
    <circle cx="565" cy="454" r="13" fill="#22c55e"/>
    <circle cx="600" cy="454" r="13" fill="#38bdf8"/>
    <circle cx="635" cy="454" r="13" fill="#a78bfa"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="742" y="202" width="390" height="90" rx="18" fill="#172033" stroke="#405273"/>
    <text x="774" y="238" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800">Composition props</text>
    <text x="774" y="268" fill="#9fb0ca" font-family="Inter, Arial, sans-serif" font-size="18">title, logo, colors, stats, captions</text>

    <rect x="742" y="318" width="390" height="90" rx="18" fill="#172033" stroke="#405273"/>
    <text x="774" y="354" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800">React scenes</text>
    <text x="774" y="384" fill="#9fb0ca" font-family="Inter, Arial, sans-serif" font-size="18">Sequence, AbsoluteFill, interpolate</text>

    <rect x="742" y="434" width="390" height="90" rx="18" fill="#172033" stroke="#405273"/>
    <text x="774" y="470" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800">Rendered outputs</text>
    <text x="774" y="500" fill="#9fb0ca" font-family="Inter, Arial, sans-serif" font-size="18">MP4, WebM, PNG stills, previews</text>
  </g>

  <rect x="96" y="566" width="1038" height="54" rx="14" fill="#101827" stroke="#314360"/>
  <rect x="122" y="588" width="210" height="10" rx="5" fill="#22c55e"/>
  <rect x="352" y="588" width="160" height="10" rx="5" fill="#38bdf8"/>
  <rect x="532" y="588" width="248" height="10" rx="5" fill="#a78bfa"/>
  <rect x="800" y="588" width="286" height="10" rx="5" fill="#f59e0b"/>
  <text x="96" y="646" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="18">Effect preview: animated product update video generated with React, Remotion, and Codex.</text>
</svg>
