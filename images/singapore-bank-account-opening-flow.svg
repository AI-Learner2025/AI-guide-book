<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Singapore bank account opening flow</title>
  <desc id="desc">A flow chart explaining how foreigners can prepare for opening a Singapore bank account.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="55%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <circle cx="1060" cy="120" r="130" fill="#dbeafe" opacity="0.48"/>
  <circle cx="135" cy="680" r="145" fill="#ede9fe" opacity="0.55"/>

  <text x="72" y="82" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">新加坡银行卡开户准备流程</text>
  <text x="72" y="126" font-family="Inter, Arial, sans-serif" font-size="21" fill="#475569">先判断身份与准证，再准备材料，最后选择银行 App 或分行路径。</text>

  <g filter="url(#shadow)">
    <rect x="70" y="178" width="250" height="172" rx="22" fill="#ffffff"/>
    <rect x="70" y="178" width="250" height="12" rx="6" fill="url(#blue)"/>
    <text x="103" y="232" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0f172a">1. 判断身份</text>
    <text x="103" y="274" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">公民 / PR / 准证持有人</text>
    <text x="103" y="306" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">还是非居民远程申请</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="360" y="178" width="250" height="172" rx="22" fill="#ffffff"/>
    <rect x="360" y="178" width="250" height="12" rx="6" fill="url(#green)"/>
    <text x="393" y="232" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0f172a">2. 准备材料</text>
    <text x="393" y="274" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">护照 / FIN / 准证或 IPA</text>
    <text x="393" y="306" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">地址证明 / 税务信息</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="650" y="178" width="250" height="172" rx="22" fill="#ffffff"/>
    <rect x="650" y="178" width="250" height="12" rx="6" fill="url(#violet)"/>
    <text x="683" y="232" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0f172a">3. 选择银行</text>
    <text x="683" y="274" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">DBS / POSB / OCBC</text>
    <text x="683" y="306" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">UOB / HSBC / 数字银行</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="940" y="178" width="190" height="172" rx="22" fill="#ffffff"/>
    <rect x="940" y="178" width="190" height="12" rx="6" fill="url(#blue)"/>
    <text x="970" y="232" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0f172a">4. 验证</text>
    <text x="970" y="274" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">Singpass / NFC</text>
    <text x="970" y="306" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">或到店核验</text>
  </g>

  <path d="M320 264 C340 264 340 264 360 264" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M610 264 C630 264 630 264 650 264" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M900 264 C920 264 920 264 940 264" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="86" y="430" width="325" height="210" rx="22" fill="#ffffff"/>
    <text x="122" y="484" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#0f172a">线上优先路线</text>
    <text x="122" y="526" font-family="Inter, Arial, sans-serif" font-size="19" fill="#334155">有 Singpass / 合资格护照</text>
    <text x="122" y="558" font-family="Inter, Arial, sans-serif" font-size="19" fill="#334155">用银行 App 上传材料</text>
    <text x="122" y="590" font-family="Inter, Arial, sans-serif" font-size="19" fill="#334155">等待即时或数日审批</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="438" y="430" width="325" height="210" rx="22" fill="#ffffff"/>
    <text x="474" y="484" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#0f172a">分行稳妥路线</text>
    <text x="474" y="526" font-family="Inter, Arial, sans-serif" font-size="19" fill="#334155">材料不完整或身份复杂</text>
    <text x="474" y="558" font-family="Inter, Arial, sans-serif" font-size="19" fill="#334155">预约分行，带原件核验</text>
    <text x="474" y="590" font-family="Inter, Arial, sans-serif" font-size="19" fill="#334155">适合非标准申请人</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="790" y="430" width="325" height="210" rx="22" fill="#ffffff"/>
    <text x="826" y="484" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#0f172a">开户后检查</text>
    <text x="826" y="526" font-family="Inter, Arial, sans-serif" font-size="19" fill="#334155">Debit card / PayNow / 转账限额</text>
    <text x="826" y="558" font-family="Inter, Arial, sans-serif" font-size="19" fill="#334155">最低余额 / 手续费 / 多币种</text>
    <text x="826" y="590" font-family="Inter, Arial, sans-serif" font-size="19" fill="#334155">SDIC 保障范围只覆盖合资格 SGD</text>
  </g>

  <text x="72" y="708" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">提示：不同银行、国籍、准证和账户产品要求不同，提交前以银行官网页面为准。</text>
</svg>
