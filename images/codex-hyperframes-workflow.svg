<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Codex and HyperFrames workflow</title>
  <desc id="desc">A workflow diagram showing how Codex works with HyperFrames to create, preview, inspect, and render videos.</desc>
  <rect width="1280" height="720" fill="#101418"/>
  <rect x="48" y="48" width="1184" height="624" rx="28" fill="#151b22" stroke="#2d3845" stroke-width="2"/>
  <text x="96" y="112" fill="#f4f0e8" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700">Codex + HyperFrames</text>
  <text x="96" y="154" fill="#9fb2c8" font-family="Inter, Arial, sans-serif" font-size="22">Use an AI coding agent to write HTML-native video compositions, then preview and render them as MP4.</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7dd3fc"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <rect x="92" y="230" width="190" height="170" rx="18" fill="#202a33" stroke="#4f6478"/>
    <text x="124" y="282" fill="#f4f0e8" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Prompt</text>
    <text x="124" y="322" fill="#b8c7d8" font-family="Inter, Arial, sans-serif" font-size="18">Story</text>
    <text x="124" y="350" fill="#b8c7d8" font-family="Inter, Arial, sans-serif" font-size="18">Style</text>
    <text x="124" y="378" fill="#b8c7d8" font-family="Inter, Arial, sans-serif" font-size="18">Assets</text>

    <rect x="342" y="230" width="190" height="170" rx="18" fill="#20302a" stroke="#5f8b70"/>
    <text x="374" y="282" fill="#f4f0e8" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Codex</text>
    <text x="374" y="322" fill="#bfd8c8" font-family="Inter, Arial, sans-serif" font-size="18">Plan scenes</text>
    <text x="374" y="350" fill="#bfd8c8" font-family="Inter, Arial, sans-serif" font-size="18">Write HTML</text>
    <text x="374" y="378" fill="#bfd8c8" font-family="Inter, Arial, sans-serif" font-size="18">Fix issues</text>

    <rect x="592" y="230" width="190" height="170" rx="18" fill="#30293d" stroke="#8066a8"/>
    <text x="624" y="282" fill="#f4f0e8" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">HTML</text>
    <text x="624" y="322" fill="#d0c1e8" font-family="Inter, Arial, sans-serif" font-size="18">CSS</text>
    <text x="624" y="350" fill="#d0c1e8" font-family="Inter, Arial, sans-serif" font-size="18">GSAP</text>
    <text x="624" y="378" fill="#d0c1e8" font-family="Inter, Arial, sans-serif" font-size="18">data-* timing</text>

    <rect x="842" y="230" width="190" height="170" rx="18" fill="#3a2d22" stroke="#b27d4a"/>
    <text x="874" y="282" fill="#f4f0e8" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Validate</text>
    <text x="874" y="322" fill="#e3c8aa" font-family="Inter, Arial, sans-serif" font-size="18">lint</text>
    <text x="874" y="350" fill="#e3c8aa" font-family="Inter, Arial, sans-serif" font-size="18">inspect</text>
    <text x="874" y="378" fill="#e3c8aa" font-family="Inter, Arial, sans-serif" font-size="18">preview</text>

    <rect x="1092" y="230" width="96" height="170" rx="18" fill="#24313f" stroke="#6ea4cc"/>
    <text x="1116" y="292" fill="#f4f0e8" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">MP4</text>
    <text x="1118" y="335" fill="#bdd9ee" font-family="Inter, Arial, sans-serif" font-size="18">render</text>
  </g>

  <line x1="292" y1="315" x2="332" y2="315" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="542" y1="315" x2="582" y2="315" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="792" y1="315" x2="832" y2="315" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1042" y1="315" x2="1082" y2="315" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="96" y="486" width="1088" height="92" rx="18" fill="#0f141a" stroke="#2b3947"/>
  <text x="124" y="525" fill="#f4f0e8" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Core loop</text>
  <text x="124" y="558" fill="#aebed0" font-family="Inter, Arial, sans-serif" font-size="20">npx hyperframes init -> write with Codex -> lint -> inspect -> preview -> render</text>
</svg>
