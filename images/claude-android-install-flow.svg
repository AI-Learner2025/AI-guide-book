<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Claude Android install flow</title>
  <desc id="desc">A visual guide for installing Claude on Android through Google Play, APK mirrors, or open source Claude Code projects.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="0.55" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#hero)"/>
  <circle cx="1060" cy="98" r="74" fill="#fed7aa" opacity="0.45"/>
  <circle cx="1038" cy="604" r="116" fill="#ddd6fe" opacity="0.35"/>
  <circle cx="88" cy="642" r="92" fill="#bae6fd" opacity="0.35"/>

  <g transform="translate(72 62)">
    <rect x="0" y="0" width="1056" height="110" rx="24" fill="#ffffff" opacity="0.82" filter="url(#shadow)"/>
    <text x="34" y="48" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="800" fill="#111827">Claude Android 安装路线图</text>
    <text x="34" y="84" font-family="Inter, Arial, sans-serif" font-size="19" fill="#475569">优先 Google Play；无法访问时谨慎使用 APK 镜像；需要 Claude Code 再看开源社区方案。</text>
    <rect x="858" y="28" width="148" height="54" rx="18" fill="url(#accent)"/>
    <text x="900" y="63" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#fff">Claude</text>
  </g>

  <g transform="translate(72 214)">
    <rect x="0" y="0" width="324" height="220" rx="24" fill="#fff" filter="url(#shadow)"/>
    <rect x="28" y="28" width="64" height="64" rx="18" fill="#16a34a"/>
    <text x="50" y="70" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#fff">1</text>
    <text x="112" y="56" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#111827">官方应用</text>
    <text x="112" y="88" font-family="Inter, Arial, sans-serif" font-size="17" fill="#64748b">Google Play 安装</text>
    <line x1="28" y1="116" x2="296" y2="116" stroke="#e2e8f0"/>
    <text x="28" y="154" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">包名：com.anthropic.claude</text>
    <text x="28" y="188" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">发布者：Anthropic PBC</text>
  </g>

  <g transform="translate(438 214)">
    <rect x="0" y="0" width="324" height="220" rx="24" fill="#fff" filter="url(#shadow)"/>
    <rect x="28" y="28" width="64" height="64" rx="18" fill="#f59e0b"/>
    <text x="50" y="70" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#fff">2</text>
    <text x="112" y="56" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#111827">APK 镜像</text>
    <text x="112" y="88" font-family="Inter, Arial, sans-serif" font-size="17" fill="#64748b">APKPure / Aptoide / Uptodown</text>
    <line x1="28" y1="116" x2="296" y2="116" stroke="#e2e8f0"/>
    <text x="28" y="154" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">只作备选下载渠道</text>
    <text x="28" y="188" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">安装前核对来源和签名</text>
  </g>

  <g transform="translate(804 214)">
    <rect x="0" y="0" width="324" height="220" rx="24" fill="#fff" filter="url(#shadow)"/>
    <rect x="28" y="28" width="64" height="64" rx="18" fill="#7c3aed"/>
    <text x="50" y="70" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#fff">3</text>
    <text x="112" y="56" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#111827">Claude Code</text>
    <text x="112" y="88" font-family="Inter, Arial, sans-serif" font-size="17" fill="#64748b">开源社区 / Termux 方案</text>
    <line x1="28" y1="116" x2="296" y2="116" stroke="#e2e8f0"/>
    <text x="28" y="154" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">OpenClaude Mobile</text>
    <text x="28" y="188" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">Claude Code on Android</text>
  </g>

  <g transform="translate(72 486)">
    <rect x="0" y="0" width="1056" height="132" rx="24" fill="#0f172a" filter="url(#shadow)"/>
    <text x="34" y="48" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#fff">安全安装检查清单</text>
    <text x="34" y="86" font-family="Inter, Arial, sans-serif" font-size="18" fill="#dbeafe">1. 优先官方商店  2. 核对包名和发布者  3. 不装破解版  4. APK 只临时开启未知来源  5. 敏感账号开启双重验证</text>
  </g>

  <g transform="translate(96 658)">
    <rect x="0" y="0" width="1008" height="46" rx="18" fill="#ffffff" opacity="0.82"/>
    <text x="28" y="30" font-family="Inter, Arial, sans-serif" font-size="17" fill="#475569">推荐顺序：Google Play 官方 Claude App → 可信 APK 镜像备选 → 需要编码能力时再研究开源 Claude Code Android 方案。</text>
  </g>
</svg>
